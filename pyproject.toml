[project]
name = "stimuli_effect_identification"
version = "0.1.0"
description = "Package to identify stimuli model from clinical data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "optuna>=4.5.0",
    "pandas>=2.3.0",
    "python-anesthesia-simulator",
    "scipy>=1.16.0",
    "tqdm>=4.67.1",
    "vitaldb>=1.5.5",
]

[tool.uv.sources]
python-anesthesia-simulator = { git = "https://github.com/BobAubouin/Python_Anesthesia_Simulator_fork", rev="9dd0890337609f6adb944048b86f26cb5fcf1e02" }
